{% extends "base.html" %}

{% block title %}
    Получатель
{% endblock %}

{% block description %}
    <h1>Получатель</h1>
{% endblock %}

{% block base_element %}

<div class="card">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Сохранить
            </button>

            <a href="{% url 'mailings:recipient_list' %}"
               class="btn btn-secondary">
                Отмена
            </a>
        </form>

    </div>
</div>

{% endblock %}
