{% extends 'base.html' %}

{% block title %}Товары категории{% endblock %}

{% block base_element %}
<div class="container">
    <h1>Товары категории</h1>

    {% for product in products %}
        <div>
            <h2>{{ product.name }}</h2>
            <p>{{ product.description }}</p>
            <p>Цена: {{ product.price }}</p>
        </div>
    {% empty %}
        <p>В этой категории нет товаров.</p>
    {% endfor %}
</div>
{% endblock %}
